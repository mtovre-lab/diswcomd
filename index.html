<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المهام اليومية الاحترافي</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 30px;
        }

        /* شاشة تسجيل الدخول وإنشاء الحساب */
        .auth-container {
            text-align: center;
            padding: 40px 20px;
            max-width: 450px;
            margin-top: 50px;
        }

        .auth-container h2 {
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .auth-container p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: right;
        }

        .auth-form label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .auth-form input {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .auth-form input:focus {
            border-color: var(--primary);
        }

        .auth-submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .auth-submit-btn:hover {
            background: var(--primary-hover);
        }

        .auth-switch {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .auth-switch a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: var(--danger);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        /* رأس الصفحة وحساب المستخدم */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            background: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--primary);
            font-size: 18px;
        }

        .user-info h4 {
            font-size: 15px;
            color: var(--text-main);
        }

        .user-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .logout-btn {
            background: #fee2e2;
            color: var(--danger);
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #fecaca;
        }

        /* تاريخ اليوم وزر اليوم */
        .date-display-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .current-date-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
        }

        .today-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .today-btn:hover {
            background: var(--primary-hover);
        }

        /* التقويم التفاعلي */
        .calendar-section {
            margin-bottom: 24px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            font-size: 16px;
        }

        .calendar-nav-btns {
            display: flex;
            gap: 8px;
        }

        .calendar-nav-btns button {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .calendar-nav-btns button:hover {
            background: var(--border);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .calendar-day-name {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            padding: 6px 0;
        }

        .calendar-day {
            padding: 8px 4px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            background: #fff;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .calendar-day:hover {
            background: #e0e7ff;
            color: var(--primary);
        }

        .calendar-day.selected {
            background: var(--primary) !important;
            color: white;
            font-weight: bold;
        }

        .calendar-day.today-marker {
            border-color: var(--primary);
            font-weight: bold;
        }

        .calendar-day.other-month {
            color: #cbd5e1;
        }

        /* لوحة الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-card span {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
        }

        .progress-bar-container {
            background: var(--border);
            border-radius: 99px;
            height: 8px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* إضافة مهمة جديدة */
        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .task-form input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .task-form input[type="text"]:focus {
            border-color: var(--primary);
        }

        .task-form input[type="time"] {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: var(--primary-hover);
        }

        /* قائمة المهام */
        .tasks-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding-left: 4px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }

        /* حالات المهام */
        .task-item.completed {
            background: #ecfdf5;
            border-color: #a7f3d0;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
            color: #065f46;
        }

        .task-item.overdue {
            background: #fef2f2;
            border-color: #fecaca;
        }

        .task-item.overdue .task-title {
            color: #991b1b;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .task-details {
            display: flex;
            flex-direction: column;
        }

        .task-title {
            font-size: 15px;
            font-weight: 500;
        }

        .task-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            border-radius: 4px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .action-btn.edit:hover {
            color: var(--primary);
        }

        .action-btn.delete:hover {
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .task-form {
                flex-direction: column;
            }
            .container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول وإنشاء الحساب -->
    <div id="authScreen" class="container auth-container">
        <h2 id="authTitle">تسجيل الدخول</h2>
        <p id="authSubtitle">أدخل اسم المستخدم وكلمة المرور للوصول إلى مهامك الخاصة.</p>
        
        <form class="auth-form" onsubmit="handleAuthSubmit(event)">
            <div id="nameFieldContainer">
                <label>اسم المستخدم:</label>
                <input type="text" id="authName" placeholder="أدخل اسمك الكامل">
            </div>
            <div>
                <label>كلمة المرور (الكود):</label>
                <input type="password" id="authPass" placeholder="أدخل كلمة المرور" required>
            </div>
            <div id="authError" class="error-msg"></div>
            <button type="submit" class="auth-submit-btn" id="authSubmitBtn">دخول</button>
        </form>

        <div class="auth-switch">
            <span id="switchText">ليس لديك حساب؟</span> 
            <a id="switchLink" onclick="toggleAuthMode()">إنشاء حساب جديد</a>
        </div>
    </div>

    <!-- التطبيق الرئيسي (مخفي حتى يتم تسجيل الدخول) -->
    <div id="appScreen" class="container" style="display: none;">
        
        <!-- رأس التطبيق مع الحساب وزر الخروج -->
        <div class="app-header">
            <div class="user-profile">
                <div id="userAvatar" class="user-avatar">م</div>
                <div class="user-info">
                    <h4 id="userName">اسم المستخدم</h4>
                    <span id="userStatus">حساب مسجل محلياً</span>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

        <!-- شريط تاريخ اليوم -->
        <div class="date-display-bar">
            <div class="current-date-text" id="todayHeaderString">...</div>
            <button class="today-btn" onclick="goToToday()">اليوم</button>
        </div>

        <!-- التقويم التفاعلي -->
        <div class="calendar-section">
            <div class="calendar-header">
                <h3 id="calendarMonthYear">أكتوبر 2026</h3>
                <div class="calendar-nav-btns">
                    <button onclick="changeMonth(-1)">&#10095;</button>
                    <button onclick="changeMonth(1)">&#10094;</button>
                </div>
            </div>
            <div class="calendar-grid">
                <div class="calendar-day-name">أحد</div>
                <div class="calendar-day-name">إثنين</div>
                <div class="calendar-day-name">ثلاثاء</div>
                <div class="calendar-day-name">أربعاء</div>
                <div class="calendar-day-name">خميس</div>
                <div class="calendar-day-name">جمعة</div>
                <div class="calendar-day-name">سبت</div>
            </div>
            <div class="calendar-grid" id="calendarDays" style="margin-top: 4px;"></div>
        </div>

        <!-- إحصائيات المهام -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>إجمالي المهام</h4>
                <span id="statTotal">0</span>
            </div>
            <div class="stat-card">
                <h4>المكتملة</h4>
                <span id="statCompleted" style="color: var(--success);">0</span>
            </div>
            <div class="stat-card">
                <h4>غير المكتملة</h4>
                <span id="statOverdue" style="color: var(--danger);">0</span>
            </div>
            <div class="stat-card">
                <h4>نسبة الإنجاز</h4>
                <span id="statPercentage">0%</span>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>
        </div>

        <!-- نموذج إضافة مهمة -->
        <div class="task-form">
            <input type="text" id="taskInput" placeholder="أدخل اسم المهمة الجديدة...">
            <input type="time" id="taskTimeInput">
            <button class="add-btn" onclick="handleTaskSubmit()">إضافة مهمة</button>
        </div>

        <!-- قائمة مهام اليوم المختار -->
        <div class="tasks-section">
            <h3 id="selectedDateTitle">مهام اليوم</h3>
            <ul class="task-list" id="taskList">
                <!-- يتم تعبئتها ديناميكياً -->
            </ul>
        </div>

    </div>

    <script>
        let isRegisterMode = false;
        let currentUser = null;
        let tasks = [];
        let currentDate = new Date();
        let selectedDate = new Date();
        let viewMonth = new Date().getMonth();
        let viewYear = new Date().getFullYear();
        let editingTaskId = null;

        const monthsArabic = [
            "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
            "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
        ];

        const daysArabic = [
            "الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"
        ];

        window.onload = function() {
            checkAuth();
        };

        // تبديل بين شاشة تسجيل الدخول وإنشاء حساب
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const submitBtn = document.getElementById('authSubmitBtn');
            const switchText = document.getElementById('switchText');
            const switchLink = document.getElementById('switchLink');
            const nameContainer = document.getElementById('nameFieldContainer');
            const errorDiv = document.getElementById('authError');

            errorDiv.style.display = 'none';

            if (isRegisterMode) {
                title.innerText = "إنشاء حساب جديد";
                subtitle.innerText = "أدخل اسمك وكلمة المرور الخاصة بك لتسجيل حسابك.";
                submitBtn.innerText = "تسجيل وحفظ الحساب";
                switchText.innerText = "لديك حساب بالفعل؟";
                switchLink.innerText = "تسجيل الدخول";
                nameContainer.style.display = 'block';
                document.getElementById('authName').setAttribute('required', 'true');
            } else {
                title.innerText = "تسجيل الدخول";
                subtitle.innerText = "أدخل اسم المستخدم وكلمة المرور للوصول إلى مهامك الخاصة.";
                submitBtn.innerText = "دخول";
                switchText.innerText = "ليس لديك حساب؟";
                switchLink.innerText = "إنشاء حساب جديد";
                nameContainer.style.display = 'block'; // اترك الاسم مطلوباً للتعرف على الحساب
                document.getElementById('authName').setAttribute('required', 'true');
            }
        }

        // التعامل مع إرسال فورم الدخول أو التسجيل
        function handleAuthSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('authName').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const errorDiv = document.getElementById('authError');

            if (!name || !pass) return;

            // جلب قاعدة بيانات الحسابات المخزنة محلياً
            let accounts = JSON.parse(localStorage.getItem('app_accounts')) || {};

            if (isRegisterMode) {
                // التأكد مما إذا كان الحساب موجوداً مسبقاً
                if (accounts[name]) {
                    errorDiv.innerText = "هذا الاسم مستخدم بالفعل. اختر اسماً آخر أو سجل الدخول.";
                    errorDiv.style.display = 'block';
                    return;
                }
                // إنشاء حساب جديد
                accounts[name] = { pass: pass };
                localStorage.setItem('app_accounts', JSON.stringify(accounts));
            } else {
                // التحقق من صحة بيانات الدخول
                if (!accounts[name] || accounts[name].pass !== pass) {
                    errorDiv.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!";
                    errorDiv.style.display = 'block';
                    return;
                }
            }

            // حفظ المستخدم الحالي في الجلسة
            currentUser = {
                name: name,
                initial: name.charAt(0).toUpperCase()
            };
            localStorage.setItem('app_current_user', JSON.stringify(currentUser));
            
            // تفريغ الحقول
            document.getElementById('authName').value = '';
            document.getElementById('authPass').value = '';
            errorDiv.style.display = 'none';

            showApp();
        }

        function checkAuth() {
            const savedUser = localStorage.getItem('app_current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showApp();
            } else {
                showAuth();
            }
        }

        function logout() {
            localStorage.removeItem('app_current_user');
            currentUser = null;
            showAuth();
        }

        function showAuth() {
            document.getElementById('authScreen').style.display = 'block';
            document.getElementById('appScreen').style.display = 'none';
        }

        function showApp() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            
            document.getElementById('userName').innerText = currentUser.name;
            document.getElementById('userAvatar').innerText = currentUser.initial;

            loadTasksFromStorage();
            updateTodayHeader();
            renderCalendar();
            renderTasks();
            updateStats();
        }

        function getStorageKey() {
            return 'tasks_' + currentUser.name;
        }

        function loadTasksFromStorage() {
            const data = localStorage.getItem(getStorageKey());
            tasks = data ? JSON.parse(data) : [];
        }

        function saveTasksToStorage() {
            localStorage.setItem(getStorageKey(), JSON.stringify(tasks));
        }

        function updateTodayHeader() {
            const dayName = daysArabic[currentDate.getDay()];
            const dayNum = currentDate.getDate();
            const monthName = monthsArabic[currentDate.getMonth()];
            const year = currentDate.getFullYear();
            document.getElementById('todayHeaderString').innerText = `${dayName} ${dayNum} ${monthName} ${year}`;
        }

        function goToToday() {
            selectedDate = new Date();
            viewMonth = selectedDate.getMonth();
            viewYear = selectedDate.getFullYear();
            renderCalendar();
            renderTasks();
        }

        function renderCalendar() {
            const monthYearEl = document.getElementById('calendarMonthYear');
            monthYearEl.innerText = `${monthsArabic[viewMonth]} ${viewYear}`;

            const daysContainer = document.getElementById('calendarDays');
            daysContainer.innerHTML = '';

            const firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
            const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();

            const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('calendar-day', 'other-month');
                dayDiv.innerText = prevMonthDays - i;
                daysContainer.appendChild(dayDiv);
            }

            for (let d = 1; d <= totalDays; d++) {
                const dayDiv = document.createElement('div');
                dayDiv.classList.add('calendar-day');
                dayDiv.innerText = d;

                const thisLoopDate = new Date(viewYear, viewMonth, d);
                
                if (isSameDate(thisLoopDate, currentDate)) {
                    dayDiv.classList.add('today-marker');
                }

                if (isSameDate(thisLoopDate, selectedDate)) {
                    dayDiv.classList.add('selected');
                }

                dayDiv.onclick = () => {
                    selectedDate = new Date(viewYear, viewMonth, d);
                    renderCalendar();
                    renderTasks();
                };

                daysContainer.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            viewMonth += direction;
            if (viewMonth > 11) {
                viewMonth = 0;
                viewYear++;
            } else if (viewMonth < 0) {
                viewMonth = 11;
                viewYear--;
            }
            renderCalendar();
        }

        function isSameDate(d1, d2) {
            return d1.getFullYear() === d2.getFullYear() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getDate() === d2.getDate();
        }

        function formatDateKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function handleTaskSubmit() {
            const input = document.getElementById('taskInput');
            const timeInput = document.getElementById('taskTimeInput');
            const text = input.value.trim();
            const time = timeInput.value;

            if (!text) return;

            const dateKey = formatDateKey(selectedDate);

            if (editingTaskId) {
                tasks = tasks.map(t => {
                    if (t.id === editingTaskId) {
                        t.text = text;
                        t.time = time;
                    }
                    return t;
                });
                editingTaskId = null;
                document.querySelector('.add-btn').innerText = "إضافة مهمة";
            } else {
                const newTask = {
                    id: Date.now().toString(),
                    dateKey: dateKey,
                    text: text,
                    time: time || "",
                    completed: false
                };
                tasks.push(newTask);
            }

            input.value = '';
            timeInput.value = '';
            saveTasksToStorage();
            renderTasks();
            updateStats();
        }

        function renderTasks() {
            const taskListEl = document.getElementById('taskList');
            const selectedDateTitleEl = document.getElementById('selectedDateTitle');
            
            const dayName = daysArabic[selectedDate.getDay()];
            selectedDateTitleEl.innerText = `مهام يوم ${dayName} ${selectedDate.getDate()} ${monthsArabic[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;

            const dateKey = formatDateKey(selectedDate);
            const currentDayTasks = tasks.filter(t => t.dateKey === dateKey);

            taskListEl.innerHTML = '';

            if (currentDayTasks.length === 0) {
                taskListEl.innerHTML = `<div class="empty-state">لا توجد مهام مسجلة لهذا اليوم. أضف مهمة جديدة بالأعلى!</div>`;
                return;
            }

            const nowReal = new Date();

            currentDayTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item';

                const taskDateObj = new Date(task.dateKey);
                const isPastDay = isDateBefore(taskDateObj, nowReal);

                let statusClass = '';
                if (task.completed) {
                    statusClass = 'completed';
                } else if (isPastDay) {
                    statusClass = 'overdue';
                }

                if (statusClass) {
                    li.classList.add(statusClass);
                }

                li.innerHTML = `
                    <div class="task-info">
                        <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTaskStatus('${task.id}')">
                        <div class="task-details">
                            <span class="task-title">${escapeHtml(task.text)}</span>
                            ${task.time ? `<span class="task-time">⏰ ${task.time}</span>` : ''}
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="action-btn edit" onclick="editTask('${task.id}')" title="تعديل">✏️</button>
                        <button class="action-btn delete" onclick="deleteTask('${task.id}')" title="حذف">🗑️</button>
                    </div>
                `;
                taskListEl.appendChild(li);
            });
        }

        function isDateBefore(d1, d2) {
            const clean1 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate());
            const clean2 = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate());
            return clean1 < clean2;
        }

        function toggleTaskStatus(id) {
            tasks = tasks.map(t => {
                if (t.id === id) {
                    t.completed = !t.completed;
                }
                return t;
            });
            saveTasksToStorage();
            renderTasks();
            updateStats();
        }

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('taskInput').value = task.text;
            document.getElementById('taskTimeInput').value = task.time;
            editingTaskId = id;
            document.querySelector('.add-btn').innerText = "تحديث المهمة";
            document.getElementById('taskInput').focus();
        }

        function deleteTask(id) {
            if (confirm("هل أنت متأكد من حذف هذه المهمة؟")) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasksToStorage();
                renderTasks();
                updateStats();
            }
        }

        function updateStats() {
            const total = tasks.length;
            const nowReal = new Date();

            let completedCount = 0;
            let overdueCount = 0;

            tasks.forEach(t => {
                if (t.completed) {
                    completedCount++;
                } else {
                    const taskDateObj = new Date(t.dateKey);
                    if (isDateBefore(taskDateObj, nowReal)) {
                        overdueCount++;
                    }
                }
            });

            const percentage = total > 0 ? Math.round((completedCount / total) * 100) : 0;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statCompleted').innerText = completedCount;
            document.getElementById('statOverdue').innerText = overdueCount;
            document.getElementById('statPercentage').innerText = percentage + '%';
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
